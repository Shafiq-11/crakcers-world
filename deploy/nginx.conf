# Nginx Reverse Proxy Configuration for Diwali Kadai
# Copy this file to /etc/nginx/sites-available/diwali-kadai
# Then link it: sudo ln -s /etc/nginx/sites-available/diwali-kadai /etc/nginx/sites-enabled/

# Upstream Node.js / Next.js server managed by PM2
upstream nextjs_upstream {
    server 127.0.0.1:3000;
    keepalive 64;
}

# HTTP server — redirects to HTTPS once Certbot is configured
server {
    listen 80;
    listen [::]:80;
    server_name yourdomain.com www.yourdomain.com; # Replace with your actual domain or VPS IP

    # Let's Encrypt ACME challenge location
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Gzip compression for faster loading on mobile connections
    gzip on;
    gzip_proxied any;
    gzip_comp_level 4;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Client body limit (protect against oversized POST attacks)
    client_max_body_size 10M;

    # Static assets caching (_next/static)
    location /_next/static {
        proxy_pass http://nextjs_upstream;
        proxy_cache_valid 200 365d;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Main reverse proxy location
    location / {
        proxy_pass http://nextjs_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;

        # Forward real client IP (critical for rate limiting in lib/rate-limit.ts)
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}

# NOTE ON SSL / HTTPS SETUP:
# To enable free automated SSL certificates via Certbot, run:
#   sudo apt install certbot python3-certbot-nginx -y
#   sudo certbot --nginx -d yourdomain.com -d www.yourdomain.com
# Certbot will automatically inject the HTTPS listen 443 block and HTTP->HTTPS redirection!
